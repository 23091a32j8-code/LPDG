[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lpdg-gateway-health"
version = "0.1.0"
description = "Offline gateway-health ranking API"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0,<4", "pyarrow>=14,<25"]

[tool.setuptools.packages.find]
where = ["src"]

